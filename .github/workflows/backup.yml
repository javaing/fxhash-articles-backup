name: Backup fxhash articles

on:
  workflow_dispatch:
    inputs:
      username:
        description: "fxhash username (e.g. aquaponics.kana)"
        required: true
        type: string
      lang:
        description: "Site UI language"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - zh-Hant
          - en
      exclude:
        description: "Comma-separated slugs / filename stems to skip (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backup
        run: |
          mkdir -p out
          exclude_args=""
          if [ -n "${{ inputs.exclude }}" ]; then
            IFS=',' read -ra items <<< "${{ inputs.exclude }}"
            for s in "${items[@]}"; do
              trimmed="$(echo "$s" | sed 's/^ *//;s/ *$//')"
              [ -n "$trimmed" ] && exclude_args="$exclude_args --exclude $trimmed"
            done
          fi
          python fxhash_backup.py "${{ inputs.username }}" --lang "${{ inputs.lang }}" $exclude_args --output-dir out

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.username }}-fxhash
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30
